name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  unit:
    name: build + unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --check plugin/hooks/pii-guard.mjs
      - run: node -e "JSON.parse(require('fs').readFileSync('plugin/hooks/hooks.json','utf8')); JSON.parse(require('fs').readFileSync('plugin/.claude-plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"

  integration:
    name: role SQL + doctor + MCP against real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm ci && npm run build
      - run: scripts/ci-integration.sh
        env:
          OWNER_URL: postgres://postgres:postgres@localhost:5432/postgres

  scrub:
    name: no private identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/scrub-check.sh
        env:
          SCRUB_HISTORY_RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '' }}
