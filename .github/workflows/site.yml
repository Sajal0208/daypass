name: Site

# Builds the website (Astro + Starlight) and runs Lighthouse CI plus a link check whenever
# the site or any Markdown it syncs in changes. Production deploys are done by the Vercel
# GitHub app, not here (see website/README.md).

on:
  pull_request:
    paths:
      - website/**
      - docs/**
      - CHANGELOG.md
      - SECURITY.md
      - ROADMAP.md
      - SUPPORT.md
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - CHANGELOG.md
      - SECURITY.md
      - ROADMAP.md
      - SUPPORT.md
      - .github/workflows/site.yml

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: build + Lighthouse CI + link check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      # Reports are written to disk (not Lighthouse's temporary public storage) and kept as a
      # workflow artifact, so a failed assertion can be inspected after the run.
      - name: Lighthouse CI
        run: npm run lhci -- --upload.target=filesystem --upload.outputDir=.lighthouseci/reports
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: website/.lighthouseci/reports
          retention-days: 14
          if-no-files-found: ignore
      # Canonical and og:url tags point at the site origin (PUBLIC_SITE_URL, a placeholder
      # until a domain is live), so that host is skipped along with rate-limited externals.
      - name: Link check
        run: npx linkinator@6.1.4 ./dist --recurse --skip "github.com|npmjs.com|plausible.io|daypass.sh"
