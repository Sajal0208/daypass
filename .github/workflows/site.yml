name: Site

# Builds the website (Astro + Starlight) and runs Lighthouse CI plus a link check whenever
# the site or any Markdown it syncs in changes. Production deploys are done by the Vercel
# GitHub app, not here (see website/README.md).

on:
  pull_request:
    paths:
      - website/**
      - docs/**
      - CHANGELOG.md
      - SECURITY.md
      - ROADMAP.md
      - SUPPORT.md
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - CHANGELOG.md
      - SECURITY.md
      - ROADMAP.md
      - SUPPORT.md
      - .github/workflows/site.yml

jobs:
  site:
    name: build + Lighthouse CI + link check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lighthouse CI
        run: npm run lhci
      # Canonical and og:url tags point at the site origin (PUBLIC_SITE_URL, a placeholder
      # until a domain is live), so that host is skipped along with rate-limited externals.
      - name: Link check
        run: npx linkinator@6.1.4 ./dist --recurse --skip "github.com|npmjs.com|plausible.io|peephole.dev"
