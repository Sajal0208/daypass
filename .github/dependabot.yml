# Dependabot keeps npm and GitHub Actions current. Groups keep the noise down:
# every @aws-sdk/* bump lands in one PR, and all other minor/patch bumps in another.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      minor-and-patch:
        update-types: [minor, patch]

  # The docs site lives in website/ once that branch lands. Until then Dependabot logs a
  # warning for the missing directory and moves on; nothing fails.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
