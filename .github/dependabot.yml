# Dependabot keeps npm and GitHub Actions current. Groups keep the noise down:
# every @aws-sdk/* bump lands in one PR, and all other minor/patch bumps in another.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      minor-and-patch:
        update-types: [minor, patch]

  # The docs site (website/, Astro + Starlight) is its own npm project with its own lockfile,
  # excluded from the root install and the published tarball, so it gets its own entry.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
